name: Bluefin
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
    tvOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", BLUEFIN_SHAREPLAY]
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Rust-Bridging-Header.h
    LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(BLUEFIN_RUST_LIB_DIR)"]
    OTHER_LDFLAGS: ["$(inherited)", "-lbluefin_apple_core", "-framework", Security, "-framework", SystemConfiguration, "-framework", Network, "-liconv", "-lresolv"]
    ENABLE_BITCODE: NO
  configs:
    Release:
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
targets:
  Bluefin:
    preBuildScripts:
      - name: Stage local license resources
        script: |
          "${BLUEFIN_LEGAL_RESOURCES_TOOL}" --xcode "${SRCROOT}/../../docs/legal/bluefin-clients" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Legal"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(BLUEFIN_LEGAL_RESOURCES_TOOL)"
          - "$(SRCROOT)/../../docs/legal/bluefin-clients"
        inputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).inputs.xcfilelist"
        outputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).outputs.xcfilelist"
    dependencies:
      - target: BluefinWatch
        embed: true
      - target: BluefinWidgets
        embed: true
    type: application
    platform: iOS
    sources:
      - path: Widgets/WidgetRoute.swift
      - path: Watch/WatchAPI.swift
      - path: Sources
        excludes: ["Integrations/Templates/**"]
      - path: Resources
        excludes: ["Preview/README.md"]
        buildPhase: resources
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Bluefin.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: BluefinIcon
    info:
      path: iOS-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Bluefin secure connection
            CFBundleURLSchemes: [bluefin]
          - CFBundleURLName: Bluefin widget navigation
            CFBundleURLSchemes: [bluefin-widget]
        CFBundleDisplayName: Bluefin
        CFBundleName: Bluefin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Connect to the media server you choose on your home network.
        NSBonjourServices: ["_bluefin-mesh._udp."]
        BluefinMeshRelayAllowlist:
          - "https://use1-1.relay.n0.iroh.link./"
          - "https://usw1-1.relay.n0.iroh.link./"
        NSCameraUsageDescription: Scan Bluefin invitation QR codes. Camera images stay on this device.
        NSMicrophoneUsageDescription: Monitor your voice through wired headphones while singing with authorized music. Bluefin does not record or transmit your microphone audio.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BluefinWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
        excludes: [Tests, Info.plist, PrivacyInfo.xcprivacy]
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        LIBRARY_SEARCH_PATHS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
  BluefinTV:
    preBuildScripts:
      - name: Stage local license resources
        script: |
          "${BLUEFIN_LEGAL_RESOURCES_TOOL}" --xcode "${SRCROOT}/../../docs/legal/bluefin-clients" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Legal"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(BLUEFIN_LEGAL_RESOURCES_TOOL)"
          - "$(SRCROOT)/../../docs/legal/bluefin-clients"
        inputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).inputs.xcfilelist"
        outputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).outputs.xcfilelist"
    type: application
    platform: tvOS
    dependencies:
      - target: BluefinTopShelf
        embed: true
    sources:
      - TopShelf/TopShelfSnapshot.swift
      - path: Sources
        excludes: ["Integrations/Templates/**"]
      - path: Resources
        excludes: ["Preview/README.md"]
        buildPhase: resources
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_ENTITLEMENTS: BluefinTV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: BluefinTV
    info:
      path: tvOS-Info.plist
      properties:
        CFBundleDisplayName: Bluefin
        CFBundleName: Bluefin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: Bluefin secure connection
            CFBundleURLSchemes: [bluefin]
          - CFBundleURLName: Bluefin Top Shelf
            CFBundleURLSchemes: [bluefin-shelf]
        NSLocalNetworkUsageDescription: Connect to the media server you choose on your home network.
        NSBonjourServices: ["_bluefin-mesh._udp."]
        BluefinMeshRelayAllowlist:
          - "https://use1-1.relay.n0.iroh.link./"
          - "https://usw1-1.relay.n0.iroh.link./"
        NSMicrophoneUsageDescription: Use your selected iPhone microphone for local karaoke voice monitoring.
        NSCameraUsageDescription: Connect your iPhone using Apple's Continuity device picker. Bluefin does not capture camera video.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BluefinTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - TopShelf/ContentProvider.swift
      - TopShelf/TopShelfSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin.topshelf
        CODE_SIGN_ENTITLEMENTS: TopShelf/TopShelf.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        LIBRARY_SEARCH_PATHS: ""
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Bluefin Top Shelf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ContentProvider"
  BluefinMac:
    preBuildScripts:
      - name: Stage local license resources
        script: |
          "${BLUEFIN_LEGAL_RESOURCES_TOOL}" --xcode "${SRCROOT}/../../docs/legal/bluefin-clients" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Legal"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(BLUEFIN_LEGAL_RESOURCES_TOOL)"
          - "$(SRCROOT)/../../docs/legal/bluefin-clients"
        inputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).inputs.xcfilelist"
        outputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).outputs.xcfilelist"
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes: ["Integrations/Templates/**", "BluefinApp.swift"]
      - path: Sources/BluefinApp.swift
      - path: Mac
        excludes: ["Info.plist", "Resources/**", "*.entitlements"]
      - path: Mac/Resources
        buildPhase: resources
      - path: Resources
        excludes: ["Preview/README.md"]
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: BluefinMacIcon
        CODE_SIGN_ENTITLEMENTS: Mac/BluefinMac.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin.mac
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "2"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Mac/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Bluefin secure connection
            CFBundleURLSchemes: [bluefin]
        CFBundleDisplayName: Bluefin
        CFBundleName: Bluefin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: Connect to your chosen media server.
        NSBonjourServices: ["_bluefin-mesh._udp."]
        BluefinMeshRelayAllowlist:
          - "https://use1-1.relay.n0.iroh.link./"
          - "https://usw1-1.relay.n0.iroh.link./"
        NSMicrophoneUsageDescription: Monitor your voice locally while singing.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  BluefinVision:
    preBuildScripts:
      - name: Stage local license resources
        script: |
          "${BLUEFIN_LEGAL_RESOURCES_TOOL}" --xcode "${SRCROOT}/../../docs/legal/bluefin-clients" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Legal"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(BLUEFIN_LEGAL_RESOURCES_TOOL)"
          - "$(SRCROOT)/../../docs/legal/bluefin-clients"
        inputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).inputs.xcfilelist"
        outputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).outputs.xcfilelist"
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes: ["Integrations/Templates/**"]
      - path: Vision
        excludes: ["Info.plist", "Resources/**"]
      - path: Vision/Resources
        buildPhase: resources
      - path: Resources
        excludes: ["Preview/README.md"]
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: BluefinVisionIcon
        CODE_SIGN_ENTITLEMENTS: Bluefin.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin.vision
        TARGETED_DEVICE_FAMILY: "7"
    info:
      path: Vision/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Bluefin secure connection
            CFBundleURLSchemes: [bluefin]
        CFBundleDisplayName: Bluefin
        CFBundleName: Bluefin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: Connect to your chosen media server.
        NSBonjourServices: ["_bluefin-mesh._udp."]
        BluefinMeshRelayAllowlist:
          - "https://use1-1.relay.n0.iroh.link./"
          - "https://usw1-1.relay.n0.iroh.link./"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
  BluefinWatch:
    preBuildScripts:
      - name: Stage local license resources
        script: |
          "${BLUEFIN_LEGAL_RESOURCES_TOOL}" --xcode "${SRCROOT}/../../docs/legal/bluefin-clients" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Legal"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(BLUEFIN_LEGAL_RESOURCES_TOOL)"
          - "$(SRCROOT)/../../docs/legal/bluefin-clients"
        inputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).inputs.xcfilelist"
        outputFileLists:
          - "$(BLUEFIN_LEGAL_FILELIST_DIR)/$(PLATFORM_NAME).outputs.xcfilelist"
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Legal
      - path: Sources/Integrations/NativeTitleSelection.swift
      - path: Sources/Integrations/WatchCompanion.swift
      - path: Sources/Integrations/ManagedPairing.swift
      - path: Watch
        excludes: ["Info.plist", "Resources/**"]
      - path: Watch/Resources
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: BluefinWatchIcon
        "ARCHS[sdk=watchos*]": "arm64 arm64_32"
        "ARCHS[sdk=watchsimulator*]": arm64
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin.watch
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        LIBRARY_SEARCH_PATHS: ""
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Bluefin
        CFBundleName: Bluefin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.glopyglerky.bluefin
        WKRunsIndependentlyOfCompanionApp: true
        UIBackgroundModes: [audio]
  BluefinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Bluefin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
  BluefinTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [Tests]
    dependencies:
      - target: BluefinTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.glopyglerky.bluefin.tvtests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
schemes:
  Bluefin:
    build:
      targets:
        Bluefin: all
    test:
      targets: [BluefinTests]
  BluefinTV:
    build:
      targets:
        BluefinTV: all
    test:
      targets: [BluefinTVTests]
  BluefinMac:
    build:
      targets:
        BluefinMac: all
  BluefinVision:
    build:
      targets:
        BluefinVision: all
  BluefinWatch:
    build:
      targets:
        BluefinWatch: all
