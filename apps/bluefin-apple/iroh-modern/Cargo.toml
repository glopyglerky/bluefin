[package]
name = "bluefin-iroh-modern"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
name = "bluefin_iroh_transport"
crate-type = ["rlib", "staticlib"]

[features]
default = []
portable-apple-check = ["netwatch/portable-apple"]

[dependencies]
netwatch = "=0.19.3"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "io-util", "net", "sync", "signal"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
httparse = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[patch.crates-io]
netdev = { path = "vendor/netdev-0.46.3" }
netwatch = { path = "vendor/netwatch-0.19.3" }
