[package]
name = "bluefin-apple-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
name = "bluefin_apple_core"
crate-type = ["staticlib", "rlib"]

[features]
default = []
iroh-probe = ["dep:iroh"]
portable-apple-check = ["bluefin-iroh-modern/portable-apple-check"]

[dependencies]
bluefin-local-assist = { path = "../../../crates/local-assist" }
bluefin-mesh-connect = { package = "mesh-connect", path = "../../../crates/mesh-connect", features = ["images", "native"] }
base64 = "0.22"
httparse = "1.10"
bluefin-iroh-modern = { path = "../iroh-modern" }
bluefin-contract = { path = "../../../crates/bluefin-contract" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
iroh = { version = "=1.4.1", optional = true, default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "io-util", "sync"] }

getrandom = "0.3"
libc = "0.2"
sha2 = "0.10"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
noq-proto = { path = "../iroh-modern/vendor/noq-proto-1.4.0" }
netdev = { path = "../iroh-modern/vendor/netdev-0.46.3" }
netwatch = { path = "../iroh-modern/vendor/netwatch-0.19.3" }

[dev-dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
