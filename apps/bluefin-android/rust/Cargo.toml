[package]
name = "bluefin-android-jni"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
[workspace]
[lib]
name = "bluefin_android"
crate-type = ["cdylib", "rlib"]
[dependencies]
bluefin-apple-core = { path = "../../bluefin-apple/rust" }
jni = { version = "=0.21.1", default-features = false }
serde_json = "1"
[patch.crates-io]
noq-proto = { path = "../../bluefin-apple/iroh-modern/vendor/noq-proto-1.4.0" }
netdev = { path = "../../bluefin-apple/iroh-modern/vendor/netdev-0.46.3" }
netwatch = { path = "../../bluefin-apple/iroh-modern/vendor/netwatch-0.19.3" }
