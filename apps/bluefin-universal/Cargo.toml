[package]
name = "bluefin-universal"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ui", "direct"]
ui = ["dep:eframe", "dep:image"]
direct = ["dep:bluefin-iroh-modern"]

[dependencies]
bluefin-contract = { path = "../../crates/bluefin-contract" }
mesh-connect = { path = "../../crates/mesh-connect", default-features = false, features = ["images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
url = { version = "2", features = ["serde"] }
futures-util = "0.3"
base64 = "0.22"
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png", "jpeg"] }
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["glow", "x11", "wayland"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
tiny_http = "0.12"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
libloading = "0.8"
getrandom = "0.3"
bluefin-iroh-modern = { path = "../bluefin-apple/iroh-modern", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
mesh-connect = { path = "../../crates/mesh-connect", default-features = false, features = ["images", "browser"] }
n0-future = "=0.3.2"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
zeroize = "1"
wgpu = { version = "27", default-features = false, features = ["webgpu", "webgl"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = { version = "=0.3.103", features = ["Location", "AbortController", "AbortSignal", "Window", "Document", "Node", "Event", "HtmlInputElement", "HtmlSelectElement", "Element", "HtmlElement", "CssStyleDeclaration", "EventTarget", "HtmlCanvasElement", "HtmlMediaElement", "Navigator", "ServiceWorkerContainer", "ServiceWorker", "ServiceWorkerRegistration", "History", "File", "FileList", "Blob"] }
js-sys = "=0.3.103"

[[bin]]
name = "bluefin-universal"
path = "src/main.rs"
required-features = ["ui"]

[patch.crates-io]
noq-proto = { path = "../bluefin-apple/iroh-modern/vendor/noq-proto-1.4.0" }
netdev = { path = "../bluefin-apple/iroh-modern/vendor/netdev-0.46.3" }
netwatch = { path = "../bluefin-apple/iroh-modern/vendor/netwatch-0.19.3" }

[profile.dev]
debug = 0
incremental = false
