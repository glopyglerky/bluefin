<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Bluefin</title>
<script>(()=>{let code='';if(location.hash.startsWith('#bluefin-connect=')){code=location.hash.slice('#bluefin-connect='.length);try{history.replaceState(null,'',location.pathname+location.search);}catch(_){code='';}}globalThis.takeBluefinLaunch=()=>{const value=code;code='';return value;};})();</script>
<link rel="stylesheet" href="./bluefin.css">
<script defer src="./bootstrap.js"></script>
<script defer src="./local-music.js"></script>
<script defer src="./native-view.js"></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div id="app">
<main id="content" class="welcome">
<div class="wordmark"><svg aria-hidden="true" viewBox="0 0 48 48"><path d="M3 12c7-8 14 8 21 0s14 8 21 0M3 24c7-8 14 8 21 0s14 8 21 0M3 36c7-8 14 8 21 0s14 8 21 0"/></svg><h1>Bluefin</h1></div>
<section class="account-stack" aria-label="Connect Bluefin">
<button id="initial-invite" type="button">Connect with QR or invitation</button>
<form id="initial-connect">
<h2>Connect to your server</h2>
<label for="initial-server" class="visually-hidden">Server address</label>
<input id="initial-server" name="server" type="url" placeholder="https://media.example.com" autocomplete="url" spellcheck="false" required>
<button type="submit" class="primary">Continue</button>
</form>
<p id="startup-status" class="secondary" role="status">Preparing connection controls…</p>
</section>
</main>
</div>
<div id="semantic" hidden></div><canvas id="bluefin" hidden></canvas>
<div id="media-host"><video id="media" controls playsinline preload="metadata" aria-label="Media player"></video></div>
<p id="playback-status" role="status"></p><output id="media-status" aria-live="polite"></output>
<noscript><section class="notice"><h2>Bluefin is ready to connect</h2><p>JavaScript is needed for sign-in and playback. WebAssembly is optional for the HTTPS library view. A device invitation can also be opened in the installed Bluefin app.</p></section></noscript>
<script>setTimeout(()=>{const s=document.getElementById('startup-status');if(s)s.textContent='The connection controls did not load. Reload this trusted HTTPS page. Your invitation has not been sent.';},6000);</script>
</body>
</html>
