[package]
name = "bluefin-tv-playback"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["server"]
server = ["dep:axum", "dep:async-trait", "dep:tokio", "dep:futures-util", "dep:tower", "dep:uuid", "dep:url", "dep:subtle"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
url = { version = "2", optional = true }
subtle = { version = "2.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
