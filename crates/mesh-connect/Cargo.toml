[package]
name = "mesh-connect"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Bounded one-use mesh invitation codecs and pinned post-quantum native connections"

[features]
default = ["images"]
images = ["dep:image", "dep:qrcode", "dep:rqrr"]
pqc = ["dep:iroh", "dep:tokio", "dep:rustls", "dep:tokio-rustls", "dep:rustls-provider-rustcrypto-pq", "dep:ml-dsa", "dep:getrandom", "dep:zeroize", "dep:yasna", "dep:time", "dep:x509-parser", "dep:hkdf"]
native = ["pqc"]
browser = ["pqc", "dep:n0-future"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2"
url = "2.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
qrcode = { version = "=0.14.1", default-features = false, optional = true }
rqrr = { version = "=0.11.0", default-features = false, optional = true }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"], optional = true }
tokio = { version = "1", features = ["io-util", "sync"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std"], optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, optional = true }
rustls-provider-rustcrypto-pq = { version = "=0.1.1", path = "../../vendor/rustls-provider-rustcrypto-pq", optional = true }
ml-dsa = { version = "=0.1.1", features = ["zeroize"], optional = true }
getrandom = { version = "=0.4.3", features = ["sys_rng"], optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }
yasna = { version = "0.6", features = ["time"], optional = true }
time = { version = "0.3", optional = true }
x509-parser = { version = "0.18.1", default-features = false, optional = true }
hkdf = { version = "0.13", optional = true }

n0-future = { version = "=0.3.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["io-util", "time", "net", "rt", "sync"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["sys_rng", "wasm_js"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
