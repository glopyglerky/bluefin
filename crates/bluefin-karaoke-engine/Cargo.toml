[package]
name = "bluefin-karaoke-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Server-private, bounded CPU source separation using the official Spleeter 2-stem model"

[features]
qualification = ["dep:reqwest", "dep:libloading", "dep:zip", "dep:prost"]

[dependencies]
candle-core = { version = "=0.11.1", default-features = false }
rustfft = "=6.4.1"
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = "0.4.46"
rustix = { version = "1.1", features = ["fs", "process"] }
getrandom = "0.4"
rayon = "1.12"
crc32c = "0.6.9"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"], optional = true }
libloading = { version = "0.9", optional = true }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"], optional = true }
prost = { version = "0.14", optional = true }

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "qualify"
required-features = ["qualification"]

